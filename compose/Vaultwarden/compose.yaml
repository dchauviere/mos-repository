services:
  vaultwarden:
    image: vaultwarden/server:latest
    depends_on:
      vaultwarden-init:
        condition: service_completed_successfully
    secrets:
      - source: 'vaultwarden-admin-token'
        target: 'vaultwarden-admin-token'
      - source: 'vaultwarden-database-url'
        target: 'vaultwarden-database-url'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.vaultwarden.rule: 'Host(`${DOMAIN}`)'
      traefik.http.routers.vaultwarden.entrypoints: 'websecure'
      traefik.http.routers.vaultwarden.tls: 'true'
      traefik.http.services.vaultwarden.loadbalancer.server.port: '80'
      traefik.http.routers.vaultwarden.tls.certresolver: 'ovhresolver'
    volumes:
      - ./vw-data:/data
    environment:
      DATABASE_URL_FILE: /run/secrets/vaultwarden-database-url
      DOMAIN: "https://${DOMAIN}"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden-admin-token
      # SMTP_HOST: smtp.domain.tld
      # SMTP_FROM: vaultwarden@domain.tld
      # SMTP_FROM_NAME: Vaultwarden
      # SMTP_USERNAME: username
      # SMTP_PASSWORD: password
      # SMTP_TIMEOUT: 15
      # SMTP_SECURITY: starttls | force_tls
    networks:
      - services
      - database

  vaultwarden-init:
    image: 'postgres:17'
    restart: 'no'
    environment:
      POSTGRES_PASSWORD_FILE: '/run/secrets/postgres-passwd'
      VAULTWARDEN_DB_USER: '${DB_USER:-vaultwarden}'
      VAULTWARDEN_DB_PASSWORD_FILE: /run/secrets/vaultwarden-db-password
    secrets:
      - source: 'postgres-passwd'
        target: 'postgres-passwd'
      - source: 'vaultwarden-db-password'
        target: 'vaultwarden-db-password'
    command: 
      - sh
      - -ec
      - |
        PGPASSWORD="$(cat "$$POSTGRES_PASSWORD_FILE")"
        export PGPASSWORD

        until pg_isready -h postgres.database -U postgres -d postgres; do
          sleep 1
        done

        psql -h postgres.database --username postgres --dbname postgres \
          --set=ON_ERROR_STOP=1 \
          --set=vaultwarden_db_user="$$VAULTWARDEN_DB_USER" \
          --set=vaultwarden_db_password="$(cat "$$VAULTWARDEN_DB_PASSWORD_FILE")" <<'SQL'
        \set QUIET 1
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'vaultwarden_db_user', :'vaultwarden_db_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'vaultwarden_db_user')
        \gexec
        SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'vaultwarden_db_user', :'vaultwarden_db_password')
        \gexec

        SELECT format('CREATE DATABASE %I OWNER %I', :'vaultwarden_db_user', :'vaultwarden_db_user')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'vaultwarden_db_user')
        \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'vaultwarden_db_user', :'vaultwarden_db_user')
        \gexec
        SQL
    networks:
      database: {}

secrets:
  postgres-passwd:
    file: '/mnt/MyData/secrets/postgres-passwd.txt'
  vaultwarden-db-password:
    file: '/mnt/MyData/secrets/vaultwarden-db-password.txt'
  vaultwarden-database-url:
    file: '/mnt/MyData/secrets/vaultwarden-database-url.txt'
  vaultwarden-admin-token:
    file: '/mnt/MyData/secrets/vaultwarden-admin-token.txt'

networks:
  services:
    external: true
  database:
    external: true
