name: Traefik
services:
  traefik:
    image: traefik:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    command:
      - --log.level=INFO
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker
      - --providers.docker.watch=true
      - --providers.docker.network=services
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=unix://var/run/docker.sock
      - "--certificatesresolvers.ovhresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.ovhresolver.acme.dnschallenge.provider=ovh"
      - "--certificatesresolvers.ovhresolver.acme.dnschallenge.resolvers=1.1.1.1,8.8.8.8"
      - "--certificatesresolvers.ovhresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.ovhresolver.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true" # Enable the dashboard
      - "--api.insecure=false" # Explicitly disable insecure API mod
      - "--api.dashboardname=Home Ingress"
      - "--api.disabledashboardad=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_URL}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    env_file:
      - ".env"
    restart: unless-stopped
    networks:
      eth0:
        ipv4_address: ${TRAEFIK_IP}
      services:

networks:
  eth0:
    external: true
  services:
    name: services

volumes:
  letsencrypt:
